<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modress — Telegram Mini App & Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #060810;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(59, 130, 246, 0.2);
        }

        body {
            background-color: var(--bg-deep);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* iOS Liquid Glass Card */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }
        .glass-input:focus {
            border-color: rgba(59, 130, 246, 0.6);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
        }

        /* Динамические переливания фона (минимализм бэкграунда) */
        .ambient-blob {
            position: fixed;
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.18) 0%, rgba(147, 51, 234, 0.08) 100%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
            animation: drift 14s ease-in-out infinite alternate;
        }
        .ambient-blob-2 {
            position: fixed;
            width: 280px;
            height: 280px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.12) 0%, rgba(16, 185, 129, 0.05) 100%);
            filter: blur(70px);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
            animation: drift-rev 18s ease-in-out infinite alternate;
        }

        @keyframes drift {
            0% { transform: translate(-30px, -20px) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.15); }
        }
        @keyframes drift-rev {
            0% { transform: translate(40px, 30px) scale(1.1); }
            100% { transform: translate(-50px, -40px) scale(0.95); }
        }

        /* Стилизованный скроллбар */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen pb-16 flex flex-col justify-between">

    <!-- Абстрактный фоновый свет -->
    <div class="ambient-blob top-12 -left-16"></div>
    <div class="ambient-blob-2 bottom-20 -right-16"></div>

    <div>
        <!-- Шапка приложения -->
        <header class="text-center my-6">
            <div class="inline-block p-2 rounded-2xl glass-panel mb-2">
                <span class="text-xs font-medium px-3 py-1 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20">Modress ecosystem</span>
            </div>
            <h1 class="text-2xl font-black bg-gradient-to-r from-blue-400 via-indigo-300 to-sky-400 bg-clip-text text-transparent">Центр Отзывов</h1>
            <p class="text-xs text-slate-400 mt-1">Публичный хаб цифровых продуктов и разработок</p>
        </header>

        <!-- Блок добавления отзыва -->
        <section class="glass-panel p-5 rounded-3xl mb-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/5 rounded-full blur-2xl pointer-events-none"></div>
            
            <h2 class="text-sm font-bold mb-3 text-blue-300 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                Оставить отзыв о проекте
            </h2>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-medium text-slate-400 mb-1 ml-1">Ваше имя / Ник</label>
                    <input type="text" id="reviewName" placeholder="Например: Алексей" class="w-full glass-input rounded-2xl p-3 text-sm focus:outline-none text-white placeholder-slate-500 transition">
                </div>

                <div>
                    <label class="block text-[11px] font-medium text-slate-400 mb-1 ml-1">Текст отзыва</label>
                    <textarea id="reviewText" rows="3" placeholder="Опишите ваш опыт сотрудничества..." class="w-full glass-input rounded-2xl p-3 text-sm focus:outline-none text-white placeholder-slate-500 transition resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-[11px] font-medium text-slate-400 mb-1 ml-1">Медиа материал (опционально)</label>
                    <label class="flex items-center justify-between w-full px-4 py-3 glass-input rounded-2xl cursor-pointer hover:bg-slate-800/40 transition text-xs text-slate-300 border border-slate-700/50">
                        <span id="fileLabel" class="truncate pr-2">Прикрепить скриншот или фото</span>
                        <svg class="w-4 h-4 text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <input type="file" id="reviewImage" accept="image/*" class="hidden" onchange="handleImage(this)">
                    </label>
                </div>

                <button onclick="submitReview()" class="w-full mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3.5 rounded-2xl transition text-sm shadow-lg shadow-blue-500/25 active:scale-[0.98]">
                    Опубликовать отзыв
                </button>
            </div>
        </section>

        <!-- Лента отзывов -->
        <section class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Лента отзывов клиентов</h3>
                <span id="reviewCount" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">0 отзывов</span>
            </div>
            
            <div id="reviewsContainer" class="space-y-3">
                <!-- Карточки загружаются динамически -->
                <div class="glass-panel p-6 rounded-2xl text-center">
                    <div class="inline-block w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mb-2"></div>
                    <p class="text-xs text-slate-400">Загрузка данных из облака...</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Футер -->
    <footer class="text-center mt-12 text-[11px] text-slate-500 border-t border-slate-800/80 pt-4">
        Modress Hub &bull; Telegram Mini App Server Client
    </footer>

    <!-- Скрипт логики -->
    <script>
        // Ваш активный домен бэкенда на Bothost
        const API_URL = "https://modress.bothost.tech/api/reviews";

        let tg = window.Telegram?.WebApp;
        tg?.ready();
        const currentUsername = tg?.initDataUnsafe?.user?.username || 'neleron'; 

        // Проверка прав администратора для @neleron
        let isAdmin = currentUsername === 'neleron' || currentUsername === 'neleronbot';

        let base64Image = "";

        function handleImage(input) {
            const file = input.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    alert('Файл слишком большой. Максимальный размер 5MB.');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    document.getElementById('fileLabel').innerText = `Файл прикреплен (${file.name.slice(0, 12)}...)`;
                    document.getElementById('fileLabel').classList.add('text-blue-400');
                }
                reader.readAsDataURL(file);
            }
        }

        async function loadReviews() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Ошибка связи с сервером');
                const reviews = await response.json();
                
                const container = document.getElementById('reviewsContainer');
                document.getElementById('reviewCount').innerText = `${reviews.length} отзывов`;
                container.innerHTML = '';

                if (reviews.length === 0) {
                    container.innerHTML = `
                        <div class="glass-panel p-6 rounded-2xl text-center text-slate-500 text-xs">
                            Пока нет ни одного отзыва. Станьте первыми, кто поделится мнением!
                        </div>`;
                    return;
                }

                reviews.reverse().forEach((review) => {
                    const card = document.createElement('div');
                    card.className = 'glass-panel p-4 rounded-2xl relative text-sm transition hover:border-slate-700';
                    
                    let deleteBtn = '';
                    if (isAdmin) {
                        deleteBtn = `
                            <button onclick="deleteReview('${review.id}')" class="absolute top-3 right-3 text-red-400 hover:text-red-300 text-[11px] bg-red-500/10 hover:bg-red-500/20 px-2.5 py-1 rounded-xl border border-red-500/20 transition flex items-center gap-1">
                                Удалить
                            </button>`;
                    }

                    let imgHtml = '';
                    if (review.image) {
                        imgHtml = `
                            <div class="mt-3 overflow-hidden rounded-xl border border-white/10 max-h-56 bg-slate-900/50">
                                <img src="${review.image}" class="w-full h-full object-cover hover:scale-105 transition duration-300 cursor-pointer" onclick="window.open(this.src)">
                            </div>`;
                    }

                    card.innerHTML = `
                        ${deleteBtn}
                        <div class="flex items-center gap-2 mb-1.5 pr-16">
                            <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-xs font-bold text-white shadow-md">
                                ${escapeHtml(review.name.charAt(0).toUpperCase())}
                            </div>
                            <h4 class="font-bold text-slate-200 text-sm">${escapeHtml(review.name)}</h4>
                        </div>
                        <p class="text-slate-300 text-xs whitespace-pre-wrap leading-relaxed pl-9">${escapeHtml(review.text)}</p>
                        <div class="pl-9">
                            ${imgHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('reviewsContainer').innerHTML = `
                    <div class="glass-panel p-6 rounded-2xl text-center text-red-400 text-xs">
                        Не удалось загрузить отзывы с хостинга. Проверьте соединение.
                    </div>`;
            }
        }

        async function submitReview() {
            const nameField = document.getElementById('reviewName');
            const textField = document.getElementById('reviewText');
            
            const name = nameField.value.trim();
            const text = textField.value.trim();

            if (!name || !text) {
                alert('Пожалуйста, заполните имя и текст отзыва!');
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, text, image: base64Image })
                });

                if (!response.ok) throw new Error('Ошибка отправки');

                nameField.value = '';
                textField.value = '';
                document.getElementById('reviewImage').value = '';
                document.getElementById('fileLabel').innerText = 'Прикрепить скриншот или фото';
                document.getElementById('fileLabel').classList.remove('text-blue-400');
                base64Image = "";
                
                loadReviews();
            } catch (error) {
                alert('Не удалось отправить отзыв на сервер!');
            }
        }

        async function deleteReview(id) {
            if (!confirm('Вы уверены, что хотите удалить этот отзыв?')) return;
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Ошибка удаления');
                loadReviews();
            } catch (e) {
                alert('Не удалось удалить отзыв с сервера.');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Автозагрузка отзывов при открытии
        loadReviews();
    </script>
</body>
</html>
